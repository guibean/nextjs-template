version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      next-react:
        patterns:
          - next
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
          - eslint-config-next
      tailwind:
        patterns:
          - tailwindcss
          - "@tailwindcss/*"
          - tw-animate-css
      tooling:
        patterns:
          - "@biomejs/*"
          - typescript
          - "@types/node"
      components:
        patterns:
          - "@base-ui/*"
          - radix-ui
          - "lucide-react"
          - class-variance-authority
          - cn

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
